<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>संकेत — Hindi Word Game MVP</title>
<style>
:root{--bg:#f6f1e7;--ink:#231f20;--paper:#fffdf8;--red:#b93434;--blue:#315d9b;--neutral:#c7b98e;--assassin:#282525}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#fffaf0 0,var(--bg) 55%);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.shell{width:min(1160px,94vw);margin:auto;padding:28px 0 48px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}h1{margin:0;font-size:clamp(34px,6vw,60px);line-height:1}.sub{opacity:.65;margin:.5rem 0}.secondary{border:1px solid #bcb4a7;background:#ffffff99;border-radius:14px;padding:11px 16px;font-weight:700}.scorebar{display:grid;grid-template-columns:1fr minmax(230px,1.25fr) 1fr;gap:12px;margin:18px 0}.score,.turnbox{min-height:78px;border-radius:18px;display:flex;align-items:center;justify-content:center}.score{color:white;gap:16px;opacity:.75}.score.active{opacity:1;transform:translateY(-2px)}.score span{font-size:34px;font-weight:900}.redscore{background:var(--red)}.bluescore{background:var(--blue)}.turnbox{background:var(--paper);border:1px solid #ded7c8;flex-direction:column;gap:5px;text-align:center}.controls,.cluebox,.current{border-radius:14px;margin-bottom:14px}.controls{display:flex;gap:14px;flex-wrap:wrap;background:#ffffff88;border:1px solid #ded7c8;padding:10px 14px}.controls .progress{margin-left:auto;opacity:.55}.cluebox,.current{background:#24211f;color:#fff;padding:14px}.cluebox{display:grid;grid-template-columns:1fr 120px 150px;gap:12px;align-items:end}.cluebox label{display:block;font-size:12px;opacity:.68;margin-bottom:5px}.cluebox input{width:100%;border:0;border-radius:11px;padding:11px}.cluebox button{height:42px;border:0;border-radius:11px;background:#f6d36d;font-weight:900}.current{display:flex;justify-content:space-between;align-items:center}.current strong{font-size:22px}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card{min-height:116px;border:0;border-radius:16px;padding:12px 7px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 0 #d5ccba;position:relative}.card.hidden{background:linear-gradient(160deg,#fffdf8,#efe8d8)}.card.red{background:#c7514b;color:white;box-shadow:0 5px 0 #923b37}.card.blue{background:#4d73a8;color:white;box-shadow:0 5px 0 #36567f}.card.neutral{background:#d9cb9f}.card.assassin{background:#282525;color:white;box-shadow:0 5px 0 #111}.hi{font-weight:900;font-size:clamp(17px,2.25vw,27px)}.roman{margin-top:5px;font-size:11px;opacity:.65;font-weight:750}.card:disabled{cursor:default}.card:not(:disabled){cursor:pointer}footer{text-align:center;font-size:12px;opacity:.45;margin-top:24px}@media(max-width:720px){.scorebar{grid-template-columns:1fr 1fr}.turnbox{grid-column:1/-1;grid-row:2}.cluebox{grid-template-columns:1fr 90px}.cluebox button{grid-column:1/-1}.board{gap:6px}.card{min-height:82px;border-radius:11px;padding:6px 3px}.hi{font-size:clamp(13px,4vw,19px)}.roman{font-size:9px}}
</style>
</head>
<body><main class="shell">
<header><div><small>HINDI WORD GAME</small><h1>संकेत</h1><p class="sub">इशारा दो. शब्द जोड़ो. अपनी टीम जिताओ.</p></div><button class="secondary" id="newGame">नया खेल</button></header>
<section class="scorebar"><div class="score redscore" id="redScore"><b>लाल</b><span id="redLeft"></span></div><div class="turnbox" id="turnbox"></div><div class="score bluescore" id="blueScore"><b>नीली</b><span id="blueLeft"></span></div></section>
<section class="controls"><label><input id="spy" type="checkbox"> 🕵️ संकेत-मास्टर दृश्य</label><label><input id="romanToggle" type="checkbox" checked> Hinglish दिखाएँ</label><span class="progress" id="progress"></span></section>
<div id="clueArea"></div><section class="board" id="board"></section><footer>Single-device MVP • Next: private room + realtime multiplayer</footer>
</main>
<script>
const WORDS=[['आम','Aam'],['दिल्ली','Delhi'],['राजा','Raja'],['चाँद','Chaand'],['रेल','Rail'],['पानी','Paani'],['शेर','Sher'],['शादी','Shaadi'],['कलम','Kalam'],['आग','Aag'],['सपना','Sapna'],['बाज़ार','Bazaar'],['मोर','Mor'],['सोना','Sona'],['बादल','Baadal'],['गंगा','Ganga'],['किताब','Kitaab'],['जलेबी','Jalebi'],['डॉक्टर','Doctor'],['ताला','Taala'],['किला','Kila'],['बच्चा','Baccha'],['पेड़','Ped'],['चाय','Chai'],['सड़क','Sadak'],['पतंग','Patang'],['ताज','Taj'],['मुंबई','Mumbai'],['नदी','Nadi'],['समोसा','Samosa'],['सूरज','Suraj'],['मंदिर','Mandir'],['मोबाइल','Mobile'],['गेंद','Gend'],['बारिश','Baarish'],['दूध','Doodh'],['घड़ी','Ghadi'],['पुल','Pul'],['नमक','Namak'],['हाथी','Haathi'],['स्कूल','School'],['सिनेमा','Cinema'],['पैसा','Paisa'],['दिवाली','Diwali'],['होली','Holi'],['पहाड़','Pahaad'],['फूल','Phool'],['रिक्शा','Rickshaw'],['क्रिकेट','Cricket'],['बल्ला','Balla'],['हवाईजहाज़','Hawaijahaz'],['कप','Cup'],['नाच','Naach'],['गाना','Gaana'],['नारियल','Nariyal'],['घोड़ा','Ghoda'],['जंगल','Jungle'],['कुर्सी','Kursi'],['दरवाज़ा','Darwaza'],['चश्मा','Chashma']];
const $=x=>document.getElementById(x); const shuffle=a=>{a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}; let game;
function createGame(){let start=Math.random()<.5?'red':'blue',other=start==='red'?'blue':'red',types=shuffle([...Array(9).fill(start),...Array(8).fill(other),...Array(7).fill('neutral'),'assassin']);let words=shuffle(WORDS).slice(0,25);game={cards:words.map((w,i)=>({hi:w[0],roman:w[1],type:types[i],revealed:false})),turn:start,redLeft:types.filter(x=>x==='red').length,blueLeft:types.filter(x=>x==='blue').length,clue:'',num:null,guesses:null,winner:null,reason:null};render()}
function endTurn(){game.turn=game.turn==='red'?'blue':'red';game.clue='';game.num=null;game.guesses=null;render()}
function reveal(i){if(game.winner||game.guesses===null||game.cards[i].revealed||$('spy').checked)return;let c=game.cards[i];c.revealed=true;if(c.type==='red')game.redLeft--;if(c.type==='blue')game.blueLeft--;if(c.type==='assassin'){game.winner=game.turn==='red'?'blue':'red';game.reason='assassin';return render()}if(game.redLeft===0){game.winner='red';game.reason='all';return render()}if(game.blueLeft===0){game.winner='blue';game.reason='all';return render()}if(c.type!==game.turn)return endTurn();game.guesses--;if(game.guesses<=0)return endTurn();render()}
function render(){let spy=$('spy').checked,roman=$('romanToggle').checked;$('redLeft').textContent=game.redLeft;$('blueLeft').textContent=game.blueLeft;$('redScore').classList.toggle('active',game.turn==='red'&&!game.winner);$('blueScore').classList.toggle('active',game.turn==='blue'&&!game.winner);$('progress').textContent=game.cards.filter(c=>c.revealed).length+'/25 खुले';$('turnbox').innerHTML=game.winner?`<strong>${game.winner==='red'?'लाल टीम':'नीली टीम'} जीत गई 🎉</strong><small>${game.reason==='assassin'?'ख़तरनाक शब्द चुना गया':'सभी शब्द मिल गए'}</small>`:`<strong>बारी: ${game.turn==='red'?'लाल टीम':'नीली टीम'}</strong><small>${game.guesses===null?'संकेत देने का समय':game.guesses+' अनुमान बाकी'}</small>`;
let ca=$('clueArea');if(game.winner)ca.innerHTML='';else if(game.guesses===null)ca.innerHTML=`<form class="cluebox" id="clueForm"><div><label>एक शब्द का संकेत</label><input id="clue" placeholder="जैसे: मिठाई" required></div><div><label>कितने शब्द?</label><input id="num" type="number" min="1" max="9" value="1" required></div><button>संकेत दें</button></form>`;else ca.innerHTML=`<section class="current"><strong>संकेत: ${game.clue} — ${game.num}</strong><button class="secondary" id="end">बारी समाप्त</button></section>`;
if($('clueForm'))$('clueForm').onsubmit=e=>{e.preventDefault();let clue=$('clue').value.trim(),n=+$('num').value;if(!clue||n<1||n>9)return;game.clue=clue;game.num=n;game.guesses=n+1;render()};if($('end'))$('end').onclick=endTurn;
$('board').innerHTML=game.cards.map((c,i)=>{let visible=c.revealed||spy;return `<button class="card ${visible?c.type:'hidden'}" data-i="${i}" ${c.revealed||game.winner||game.guesses===null||spy?'disabled':''}><span class="hi">${c.hi}</span>${roman?`<span class="roman">${c.roman}</span>`:''}</button>`}).join('');document.querySelectorAll('.card:not(:disabled)').forEach(b=>b.onclick=()=>reveal(+b.dataset.i))}
$('newGame').onclick=createGame;$('spy').onchange=render;$('romanToggle').onchange=render;createGame();
</script></body></html>
